[project]
name = "pmxmc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "arviz>=v1.2.0",
 "diffrax>=0.7.2",
 "jax>=0.10.1",
 "netcdf4>=1.7.4",
 "nutpie>=0.16.8",
 "pandas>=3.0.2",
 "polars>=1.0.0",
 "pymc>=6",
 "pymc-debug",
 "pymc-extras",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmxmc"]

[tool.uv.sources]
pymc-debug = { path = "../pymc_debug", editable = true }
pymc-extras = { path = "../upstream/pymc-extras", editable = true }

[dependency-groups]
dev = [
    "prek>=0.3.11",
]
